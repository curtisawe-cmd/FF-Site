# Netlify configuration for the Bitch Boy League site.
#
# The site itself is still a single static index.html with no build step - publish is the repo
# root and the build command is empty. The only thing Netlify builds is the two push functions
# in netlify/functions, which it bundles by itself.

[build]
  publish = "."
  command = ""
  # Netlify scans the build output for the VALUES of this site's environment variables and
  # fails the deploy if it finds one. ONESIGNAL_APP_ID is deliberately in index.html: the
  # OneSignal SDK needs it to initialise in the browser, so every visitor is served it anyway.
  # It identifies the app, it does not authorise anything - it is public by design, the same way
  # the Firebase web config is.
  #
  # ONESIGNAL_API_KEY - the REST key, which really is a secret - is deliberately NOT listed here.
  # It stays scanned, so if it ever did leak into the page the build would still fail, which is
  # the protection actually worth having.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "ONESIGNAL_APP_ID"
    # Netlify also runs a HEURISTIC pass that flags anything merely shaped like a credential,
    # regardless of whether it is one of this site's variables. index.html carries the Firebase
    # web config, and a Firebase web apiKey looks exactly like an API key while being public by
    # design - it identifies the project, and access is controlled by the database rules, not by
    # keeping it hidden. It is in every visitor's copy of the page already.
    #
    # This switches off the guesswork, NOT the scan. The check that matters - "is one of this
    # site's actual environment variable values sitting in the output" - still runs, and
    # ONESIGNAL_API_KEY is still covered by it.
    SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The app is one page that routes on the hash, so any unknown path serves it rather than 404ing.
# Functions are excluded, or /.netlify/functions/push would be swallowed by the catch-all.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never let the page itself be cached: a stale index.html is a stale app, and the service
# worker is network-first for exactly the same reason.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Only production costs anything.
#
# Netlify builds a preview for every pull request and, if branch deploys are on, for every
# branch push. Both spend from the same monthly build allowance as the live site. For a repo
# where the whole app is one static file and a couple of functions, a preview is rarely worth
# a build - and a run of failed ones can quietly eat the month.
#
# The ignore command decides whether a build proceeds, and its exit code reads backwards from
# the way it looks: 0 means SKIP, non-zero means go ahead. So `exit 0` is "never build this
# context". Production is untouched and still builds on every push to main.
#
# The cost of this: no preview URL to click around on before merging. Delete these two blocks
# for a while if that trade stops being worth it.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
